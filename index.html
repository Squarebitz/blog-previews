<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ========== Card Section ========== -->
    <section>
      <article class="container">
        <div class="banner"></div>

        <div class="description">
          <button class="categories">Learning</button>
          <p class="date_text">Published 21 Dec 2023</p>

          <h1 class="title">HTML & CSS foundations</h1>
          <p class="description_text">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>

        <div class="profile">
          <img
            src="assets/images/image-avatar.webp"
            alt=""
            width="
          32"
            height="32"
          />

          <h3 class="author">Greg Hooper</h3>
        </div>
      </article>

      <p class="attribution">Coded by <a href="https://github.com/Squarebitz">Unscarthed</a></p>
    </section>
  </body>
</html>
